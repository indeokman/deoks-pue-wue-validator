name: Validate PUE/WUE Calculator

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run 23-case unit test suite
        run: python -m unittest discover -s tests -v
      - name: Verify valid mixed-unit sample CLI output
        run: python pue_wue.py examples/valid_2m_mixed_units.csv
